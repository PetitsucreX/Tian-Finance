[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vat-ca3"
version = "0.1.0"
description = "Monthly CA3 workflow automation with exception-stop controls"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Voice/video transcriber extras (macOS). Install with:
#   pip install -e ".[transcriber]"
# faster-whisper bundles PyAV, so no system ffmpeg binary is required.
# mlx-whisper adds the Apple-Silicon GPU backend (installed only on arm64 macOS).
transcriber = [
    "faster-whisper>=1.0",
    "osxphotos>=0.68",
    "mlx-whisper>=0.4; platform_system == 'Darwin' and platform_machine == 'arm64'",
]

[project.scripts]
voice-transcriber = "voice_transcriber.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
